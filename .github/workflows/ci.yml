name: CI

on:
  push:
    # `main` plus the branch namespaces that deploy to Pages — a branch that can
    # go live should have been through CI first.
    branches:
      - main
      - 'claude/**'
      - 'art/**'
  pull_request:

# A rapid series of pushes only needs the newest commit checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Lint is not type-aware, so it runs before the build.
      - name: Lint
        run: pnpm lint

      # Build first: cli and web resolve @flow-lines/core through its emitted
      # declarations, so typecheck needs core's dist to exist.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
