name: Delete Closed-PR Branches

# Art projects are developed on art/<project>/<feature> branches and surfaced
# as tabs in the web app. When a PR closes — whether it merged or was
# abandoned — delete its branch so stale work doesn't linger.

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch of closed PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const merged = context.payload.pull_request.merged;

            // Don't delete main or protected branches
            if (branch === 'main' || branch === 'master') {
              console.log(`Skipping deletion of protected branch: ${branch}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              console.log(`Deleted ${merged ? 'merged' : 'closed'} branch: ${branch}`);
            } catch (error) {
              console.log(`Failed to delete branch ${branch}: ${error.message}`);
            }
