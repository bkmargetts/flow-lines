name: Label Sidecars

# Keep test-images/*.labels.png up to date: whenever the photo bank or the
# generator changes, run SegFormer over any image missing a sidecar and
# commit the results. The script skips images that already have sidecars,
# so re-runs are no-ops, and pushes made with GITHUB_TOKEN don't re-trigger
# workflows, so this can't loop.
on:
  push:
    paths:
      - 'test-images/**'
      - 'scripts/segment-labels.mjs'
      - '.github/workflows/labels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build core
        run: pnpm --filter @flow-lines/core build

      - name: Generate label sidecars
        run: node scripts/segment-labels.mjs

      - name: Commit sidecars
        run: |
          if [[ -n "$(git status --porcelain test-images)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test-images/*.labels.png
            git commit -m "Generate semantic label sidecars"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "All sidecars up to date."
          fi
